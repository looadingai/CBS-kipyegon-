<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABS Mobile Banking - Loan Application Step 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: #f4f6f9;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        .header {
            background-color: #3b3a8a; /* Dark blue/purple */
            color: white;
            padding: 30px 25px 25px 25px;
            text-align: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #7cc544; /* Bright green */
        }

        .header h1 {
            font-size: 20px;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        
        .step-dot.active {
            background: #7cc544;
            transform: scale(1.2);
        }
        
        .content {
            padding: 30px;
        }
        
        h2 {
            color: #3b3a8a;
            margin-bottom: 5px;
            font-size: 22px;
        }
        
        .step-number {
            color: #7cc544;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            display: block;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: #fff;
            color: #333;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        input:focus {
            border-color: #3b3a8a;
            box-shadow: 0 0 0 3px rgba(59, 58, 138, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .phone-input {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .phone-input:focus-within {
            border-color: #3b3a8a;
            box-shadow: 0 0 0 3px rgba(59, 58, 138, 0.1);
        }
        
        .country-code {
            padding: 0 15px;
            background: #f4f6f9;
            height: 100%;
            display: flex;
            align-items: center;
            color: #333;
            font-weight: 600;
            border-right: 1px solid #ddd;
        }
        
        .phone-input input {
            border: none;
            background: transparent;
            box-shadow: none !important;
        }
        
        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
            display: block;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-prev {
            background: #f0f0f0;
            color: #666;
            width: 35%;
        }
        
        .btn-prev:hover {
            background: #e2e2e2;
        }
        
        .btn-next {
            background-color: #3b3a8a;
            color: white;
            flex: 1;
            box-shadow: 0 4px 10px rgba(59, 58, 138, 0.3);
        }
        
        .btn-next:hover {
            background-color: #2f2e70;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
        }

        @media (max-width: 480px) {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border-radius: 0;
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">CABS<span>)</span></div>
            <h1>Loan Application</h1>
            <div class="step-indicator">
                <div class="step-dot"></div>
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
            </div>
        </div>
        
        <div class="content">
            <span class="step-number">Step 2 of 3</span>
            <h2>Personal Information</h2>
            
            <div class="form-row">
                <div class="input-group">
                    <label class="input-label">First Name</label>
                    <input type="text" id="firstName" placeholder="John">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Last Name</label>
                    <input type="text" id="lastName" placeholder="Doe">
                </div>
            </div>
            
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" id="email" placeholder="john.doe@example.com">
            </div>
            
            <div class="input-group">
                <label class="input-label">Phone Number</label>
                <div class="phone-input">
                    <div class="country-code">+263</div>
                    <input type="tel" id="phone" placeholder="775594888" maxlength="9">
                </div>
                <span class="hint">Enter 9 digits (e.g., 775594888)</span>
            </div>
            
            <div class="button-group">
                <button class="btn btn-prev" onclick="prevStep()">Back</button>
                <button class="btn btn-next" onclick="nextStep()">Next Step</button>
            </div>
        </div>
        
        <div class="footer">
            © 2026 CABS. All rights reserved.
        </div>
    </div>

    <script>
        // Get saved data
        let applicationData = JSON.parse(localStorage.getItem('loanApplication')) || {};
        
        // Initialize form with saved values
        document.addEventListener('DOMContentLoaded', function() {
            if (applicationData.firstName) {
                document.getElementById('firstName').value = applicationData.firstName;
            }
            if (applicationData.lastName) {
                document.getElementById('lastName').value = applicationData.lastName;
            }
            if (applicationData.email) {
                document.getElementById('email').value = applicationData.email;
            }
            if (applicationData.phone) {
                document.getElementById('phone').value = applicationData.phone;
            }
            
            // Auto-save on input
            const inputs = ['firstName', 'lastName', 'email', 'phone'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', function() {
                    applicationData[id] = this.value;
                    localStorage.setItem('loanApplication', JSON.stringify(applicationData));
                });
            });
        });
        
        function prevStep() {
            window.location.href = 'application-step1.html';
        }
        
        function nextStep() {
            // Validate inputs
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if (!firstName || !lastName || !email || !phone) {
                alert('Please fill in all fields');
                return;
            }
            
            if (!validateEmail(email)) {
                alert('Please enter a valid email address');
                return;
            }
            
            if (phone.length < 9) {
                alert('Please enter a valid phone number (9 digits)');
                return;
            }
            
            // Save data
            applicationData.firstName = firstName;
            applicationData.lastName = lastName;
            applicationData.email = email;
            applicationData.phone = phone;
            
            localStorage.setItem('loanApplication', JSON.stringify(applicationData));
            
            // Go to next step
            window.location.href = 'application-step3.html';
        }
        
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
    </script>
</body>
</html>
