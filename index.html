<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABS Mobile Banking - Loan Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        
        .logo {
            font-size: 28px;
            color: #3b3a8a;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .logo span {
            color: #7cc544;
        }
        
        h1 {
            color: #3b3a8a;
            margin-bottom: 10px;
            font-size: 26px;
        }
        
        .tagline {
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            text-align: center;
        }
        
        .feature {
            padding: 10px;
        }
        
        .feature i {
            font-size: 22px;
            color: #7cc544;
            margin-bottom: 10px;
        }
        
        .feature p {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }
        
        .apply-btn {
            background-color: #3b3a8a;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(59, 58, 138, 0.3);
        }
        
        .apply-btn:hover {
            background-color: #2f2e70;
        }
        
        .steps {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            position: relative;
        }
        
        .step {
            background: #f0f0f0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            position: relative;
            z-index: 2;
            font-weight: 600;
        }
        
        .step.active {
            background: #7cc544;
            color: white;
        }
        
        .step-line {
            position: absolute;
            top: 15px;
            left: 15%;
            right: 15%;
            height: 2px;
            background: #f0f0f0;
            z-index: 1;
        }
        
        .step-progress {
            position: absolute;
            top: 15px;
            left: 15%;
            height: 2px;
            background: #7cc544;
            z-index: 1;
            width: 0%;
            transition: width 0.5s;
        }
        
        .step-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">CABS<span>)</span></div>
        <h1>Get Your Loan Approved Fast</h1>
        <p class="tagline">Quick approval • Competitive rates • Flexible terms</p>
        
        <div class="features">
            <div class="feature">
                <i class="fas fa-bolt"></i>
                <p>Fast Approval<br>Within 24 hours</p>
            </div>
            <div class="feature">
                <i class="fas fa-percentage"></i>
                <p>Low Rates<br>Competitive</p>
            </div>
            <div class="feature">
                <i class="fas fa-shield-alt"></i>
                <p>Secure<br>Bank-level</p>
            </div>
        </div>
        
        <button class="apply-btn" onclick="startApplication()">
            <i class="fas fa-rocket"></i> Apply for Loan Now
        </button>
        
        <div class="steps">
            <div class="step-line"></div>
            <div class="step-progress" id="stepProgress"></div>
            <div class="step active">1</div>
            <div class="step">2</div>
            <div class="step">3</div>
        </div>
        
        <div class="step-labels">
            <span>Loan Details</span>
            <span>Personal Info</span>
            <span>Submit</span>
        </div>
        
        <div class="footer">
            © 2026 CABS. All rights reserved.
        </div>
    </div>

    <script>
        function startApplication() {
            window.location.href = "application-step1.html";
        }
        
        // Animate progress bar
        setTimeout(() => {
            document.getElementById('stepProgress').style.width = '33%';
        }, 500);
    </script>
</body>
</html>
